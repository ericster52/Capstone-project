<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<h1>The Extremely Serious Nap Club</h1>

<h2>Join us in our mission to sleep more!</h2>

<p>
    Fill out this form if you believe naps are the most important
    part of the school day.
</p>

<form method="get">

    <label for="name">Your Name:</label>
    <input type="text"
           id="name"
           name="name"
           placeholder="Enter your name"
           required>

    <br><br>

    <label for="email">Your Email:</label>
    <input type="email"
           id="email"
           name="email"
           placeholder="Enter your email">

    <br><br>

    <h3>Do you take naps after school?</h3>

    <label for="yes">Yes</label>
    <input type="radio"
           id="yes"
           name="nap_choice"
           value="yes">

    <label for="no">No</label>
    <input type="radio"
           id="no"
           name="nap_choice"
           value="no">

    <br><br>

    <p>Choose your ideal nap length:</p>

    <select name="nap_length">

        <option value="20 minutes">20 minutes</option>

        <option value="1 hour">1 hour</option>

        <option value="3 hours">3 hours</option>

        <option value="forever">Forever</option>

    </select>

    <br><br>

    <label for="color">Choose your dream pillow color:</label>

    <input type="color"
           id="color"
           name="pillow_color">

    <br><br>

    <p>Why should we let you join the Nap Club?</p>

    <textarea
        name="reason"
        rows="6"
        cols="50"
        placeholder="Explain why you are an elite napper...">
    </textarea>

    <br><br>

    <input type="submit" value="Join the Nap Club!">

</form>

   
</body>
</html>
